<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlindSpot Fixture B06 — Positive tabindex (scrambled focus order)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f5f5f5; }
  main { max-width: 700px; margin: 0 auto; }
  h1 { color: #1e3a5f; }
  
  .card { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .card h2 { margin-top: 0; color: #1e3a5f; font-size: 1rem; text-transform: uppercase; letter-spacing: .05em; }
  
  .form-row { display: flex; gap: 16px; margin-bottom: 16px; }
  .form-group { flex: 1; }
  label { display: block; font-weight: 600; margin-bottom: 6px; color: #333; font-size: .9rem; }
  input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; box-sizing: border-box; }
  input:focus, select:focus { outline: 2px solid #1e3a5f; }
  
  .btn { padding: 10px 20px; border-radius: 4px; font-size: 1rem; cursor: pointer; border: none; }
  .btn-primary { background: #1e3a5f; color: #fff; }
  .btn-secondary { background: #e5e7eb; color: #333; }
  .btn:focus { outline: 2px solid #1e3a5f; outline-offset: 2px; }
  
  .help-link { color: #2563eb; font-size: .9rem; }
  .help-link:focus { outline: 2px solid #2563eb; }
  
  .footer-links { display: flex; gap: 20px; margin-top: 24px; }
  .footer-links a { color: #2563eb; font-size: .9rem; }
  .footer-links a:focus { outline: 2px solid #2563eb; }
</style>
</head>
<body>
<main>
  <h1>Checkout</h1>

  <div class="card">
    <h2>Contact information</h2>
    <!-- SEEDED BUG: positive tabindex values scramble the logical tab order -->
    <!-- Expected order: First Name → Last Name → Email → Phone → Card → Expiry → CVV → Billing → Submit -->
    <!-- Actual order will jump around unpredictably due to positive tabindex values -->
    
    <div class="form-row">
      <div class="form-group">
        <label for="first-name">First name</label>
        <input type="text" id="first-name" tabindex="3" placeholder="Jane" />
        <!-- BUG: tabindex=3 but visually first -->
      </div>
      <div class="form-group">
        <label for="last-name">Last name</label>
        <input type="text" id="last-name" tabindex="4" placeholder="Smith" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" tabindex="1" placeholder="jane@example.com" />
        <!-- BUG: tabindex=1 puts this first in focus order despite being third visually -->
      </div>
      <div class="form-group">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" tabindex="5" placeholder="+1 555 0100" />
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Payment details</h2>
    <div class="form-group" style="margin-bottom:16px;">
      <label for="card">Card number</label>
      <input type="text" id="card" tabindex="2" placeholder="1234 5678 9012 3456" />
      <!-- BUG: tabindex=2 makes this second in focus order, before name fields -->
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="expiry">Expiry</label>
        <input type="text" id="expiry" tabindex="6" placeholder="MM/YY" />
      </div>
      <div class="form-group">
        <label for="cvv">CVV</label>
        <input type="text" id="cvv" tabindex="7" placeholder="123" />
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Billing address</h2>
    <div class="form-group" style="margin-bottom:16px;">
      <label for="address">Street address</label>
      <input type="text" id="address" tabindex="8" placeholder="123 Main St" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="city">City</label>
        <input type="text" id="city" tabindex="9" placeholder="San Francisco" />
      </div>
      <div class="form-group">
        <label for="zip">ZIP code</label>
        <input type="text" id="zip" tabindex="10" placeholder="94105" />
      </div>
    </div>
  </div>

  <div style="display:flex; gap:12px; align-items:center;">
    <button class="btn btn-primary" tabindex="12" id="submit-btn">Place order</button>
    <!-- BUG: tabindex=12 puts this AFTER the back link below -->
    <button class="btn btn-secondary" tabindex="11" id="back-btn">Back</button>
    <!-- BUG: tabindex=11 puts "Back" before "Place order" -->
  </div>
  <a class="help-link" href="#" tabindex="13" style="display:block;margin-top:12px;">Need help? Contact support</a>
</main>
</body>
</html>
