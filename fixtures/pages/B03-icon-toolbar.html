<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlindSpot Fixture B03 — Icon Toolbar (buttons with no accessible names)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; }
  header { background: #1a1a2e; color: #fff; padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1.1rem; margin: 0; }
  
  /* ── BUGGY TOOLBAR ── */
  .toolbar {
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    padding: 8px 20px;
    display: flex;
    gap: 4px;
    align-items: center;
  }
  /* BUG: icon-only buttons with no aria-label and no visible text */
  .toolbar button {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 8px;
    cursor: pointer;
    font-size: 1.2rem;
    line-height: 1;
    color: #333;
  }
  .toolbar button:hover { background: #f0f0f0; border-color: #ccc; }
  .toolbar button:focus { outline: 2px solid #0066cc; outline-offset: 2px; }
  .toolbar-separator { width: 1px; height: 24px; background: #e0e0e0; margin: 0 4px; }
  
  main { padding: 24px; max-width: 800px; margin: 0 auto; }
  .editor { background: #fff; border: 1px solid #ccc; border-radius: 4px; min-height: 300px; padding: 16px; line-height: 1.6; }
  .editor:focus { outline: 2px solid #0066cc; }
</style>
</head>
<body>
<header>
  <h1>Document Editor</h1>
</header>

<!-- SEEDED BUG: Every toolbar button has only an emoji/icon — no aria-label, no title, no visible text -->
<div class="toolbar" role="toolbar" aria-label="Formatting">
  <!-- BUG: each button below announces only "button" to screen readers — no name -->
  <button id="btn-bold" onclick="format('bold')"><strong>B</strong></button>
  <button id="btn-italic" onclick="format('italic')"><em>I</em></button>
  <button id="btn-underline" onclick="format('underline')"><u>U</u></button>
  <div class="toolbar-separator"></div>
  <button id="btn-align-left" onclick="format('justifyLeft')">&#8676;</button>
  <button id="btn-align-center" onclick="format('justifyCenter')">&#8652;</button>
  <button id="btn-align-right" onclick="format('justifyRight')">&#8677;</button>
  <div class="toolbar-separator"></div>
  <button id="btn-link" onclick="insertLink()">&#128279;</button>
  <button id="btn-image" onclick="insertImage()">&#128247;</button>
  <button id="btn-table" onclick="insertTable()">&#9783;</button>
  <div class="toolbar-separator"></div>
  <button id="btn-undo" onclick="document.execCommand('undo')">&#8630;</button>
  <button id="btn-redo" onclick="document.execCommand('redo')">&#8631;</button>
</div>

<main>
  <div class="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Document content">
    Start typing your document here. Use the toolbar above to format text.
  </div>
</main>

<script>
  function format(cmd) { document.execCommand(cmd); }
  function insertLink() { alert('Insert link (demo)'); }
  function insertImage() { alert('Insert image (demo)'); }
  function insertTable() { alert('Insert table (demo)'); }
</script>
</body>
</html>
